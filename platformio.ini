; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

##################################################################
# Default Setup : DO-NOT CHANGE HERE  
##################################################################
[platformio]
src_dir = .
include_dir = include

# Default environment setting
[env]
platform = ststm32
board = nucleo_f411re
framework = cmsis
debug_tool = stlink
build_flags = -Wl,-u,_print_float,-u,_scanf_float, -std=c11, -O3

##################################################################
# User-Defined Environment   
##################################################################
#
## For example: LAB GPIO
[env:test]
build_src_filter = +<test/test.c> +<include/*.c>

[env:TU_CreateProject_Example1]
build_src_filter = +<tutorial/TU_CreateProject_VSC/TU_CreateProject_Example1_main.c> +<include/*.c>

[env:TU_GPIO_Digital_Out_LED]
build_src_filter = +<tutorial/TU_GPIO_Digital_Out_LED_22200576.c> +<include/*.c> 

[env:TU_GPIO_Digital_In_Button]
build_src_filter = +<tutorial/TU_GPIO_Digital_Inout_Button_22200576.c> +<include/*.c>

[env:LAB_GPIO_DIO_LED_Photosensor]
build_src_filter = +<lab/LAB_GPIO_DIO_LED_22200576/LAB_GPIO_DIO_LED_Photosensor_22200576.c> +<include/*.c>

[env:LAB_GPIO_DIO_multiLED]
build_src_filter = +<lab/LAB_GPIO_DIO_LED_22200576/LAB_GPIO_DIO_multiLED_22200576.c> +<include/*.c>

[env:TU_GPIO_7segment]
build_src_filter = +<tutorial/TU_GPIO_7segment.c> +<include/*.c>

[env:LAB_GPIO_7segment]
build_src_filter = +<lab/LAB_GPIO_7segment_22200576/LAB_GPIO_7segment.c> +<include/*.c>